{% extends 'dashboard/base_admin.html' %}

{% block content %}
<h2>Valider Rendez-vous</h2>

<p>Patient : {{ rdv.patient.get_full_name }}</p>
<p>Date : {{ rdv.date }}</p>
<p>Heure : {{ rdv.heure }}</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Valider</button>
  <a href="{% url 'liste_rendezvous_hopital' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
