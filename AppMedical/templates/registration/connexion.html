<!-- BEGIN BODY -->

<body class=" login_page">

    <div class="container-fluid">
        <div class="login-wrapper row">
            <div id="login" class="login loginpage col-lg-offset-3 col-md-offset-3 col-sm-offset-3 col-xs-offset-0 col-xs-12 col-sm-6 col-lg-6">    
                <div class="login-form-header">
                     <img src="{% static 'data/icons/padlock.png' %}" alt="login-icon" style="max-width:64px">
                     <div class="login-header">
                         <h4 class="bold color-white">Login Now!</h4>
                         <h4><small>Please enter your credentials to login.</small></h4>
                     </div>
                </div>
               
                <div class="box login">

                    <div class="content-body" style="padding-top:30px">

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-warning">{{ message }}</div>
                            {% endfor %}
                        {% endif %}


                        <form method="post" novalidate>
                            {% csrf_token %}


                            <div class="row">
                                <div class="col-xs-12">

                                        <div class="form-group">
                                            <label class="form-label">Username</label>
                                            {{ form.username }}
                                    </div>


                                    <div class="form-group">
                                        <label class="form-label">Password</label>
                                            {{ form.password }}
                                    </div>

                                    <div class="pull-left">
                                        <button type="submit" class="btn btn-primary mt-10 btn-corner right-15">Se connecter</button>
                                        <a class='btn mt-10 btn-corner signup' href="{% url 'inscription' %}">Sign up</a>
                                    </div>

                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <p id="nav">
                    <a class="pull-left" href="#" title="Password Lost and Found">Forgot password?</a>
                </p>

            </div>
        </div>
    </div>

    <!-- MAIN CONTENT AREA ENDS -->
