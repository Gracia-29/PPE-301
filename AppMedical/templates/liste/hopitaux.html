{% extends "dashboard/base_patient.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Liste des hôpitaux</h2>
    <ul class="list-group">
    {% for hopital in hopitaux %}
        <div class="card">
            <h4>{{ hopital.nom }}</h4>
            <p>{{ hopital.adresse }}</p>
            <a href="{% url 'demande_inscription' hopital.id %}" class="btn btn-primary">
                S’inscrire
            </a>
        </div>
    {% endfor %}

    </ul>
</div>
{% endblock %}
