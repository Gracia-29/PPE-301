{% extends 'patient/base_patient.html' %}
{% block title %}Ajouter une personne a prevenir{% endblock %}
{% block content %}
<section class="panel" data-reveal>
    <span class="eyebrow">Contact d'urgence</span>
    <h1 class="section-title" style="font-size:2.3rem;">Ajouter une personne a prevenir</h1>
    <form method="post" class="form-layout">
        {% csrf_token %}
        {% include 'includes/form_fields.html' with form=form %}
        <button type="submit">Enregistrer le contact</button>
    </form>
</section>
{% endblock %}
