{% extends 'patient/base_patient.html' %}
{% block title %}Modifier le profil patient{% endblock %}
{% block content %}
<section class="panel" data-reveal>
    <span class="eyebrow">Edition du compte</span>
    <h1 class="section-title" style="font-size:2.3rem;">Mettre a jour mon profil</h1>
    <form method="post" enctype="multipart/form-data" class="form-layout">
        {% csrf_token %}
        {% include 'includes/form_fields.html' with form=form %}
        <button type="submit">Sauvegarder</button>
    </form>
</section>
{% endblock %}
